[pytest]
# Three layers, cheapest first:
#   tests/unit  - pure Python, no server, no network (seconds)
#   tests/api   - against a running server, no LLM tokens spent
#   tests/llm   - against a running server, spends LLM tokens (opt-in: -m llm)
testpaths = tests/unit tests/api tests/llm
addopts = -ra -m "not llm" -p no:cacheprovider
markers =
    api: needs a running server (ANALYST_URL, default http://127.0.0.1:8000)
    llm: needs a running server and spends LLM tokens; run with -m llm
    slow: takes more than a few seconds
filterwarnings =
    ignore::DeprecationWarning
    ignore:.*API_KEYS not set.*
    ignore:Please use `import python_multipart` instead:PendingDeprecationWarning
    ignore:invalid value encountered in reduce:RuntimeWarning
